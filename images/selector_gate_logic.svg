<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="親子ゲートのAND条件と2つのゲートのOR条件">
<style>
  .title{font:700 32px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#173d66}
  .subtitle{font:700 24px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#0b5fa5}
  .body{font:500 22px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#23364a}
  .small{font:500 19px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#52677b}
  .axis{stroke:#263746;stroke-width:4;fill:none;stroke-linecap:round}
  .curve{stroke:#1677c8;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .curve2{stroke:#d94343;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .panel{fill:#ffffff;stroke:#c9d9e8;stroke-width:2}
  .grid{stroke:#e7edf3;stroke-width:2}
  .callout{fill:#eef7ff;stroke:#9fc6e8;stroke-width:2}
  .good{fill:#effaf3;stroke:#77c795;stroke-width:2}
  .warn{fill:#fff9df;stroke:#e0a800;stroke-width:2}
</style>
<rect x="1" y="1" width="1198" height="598" rx="20" class="panel"/>
<text x="50" y="58" class="title">ゲート階層の考え方</text>
<rect x="45" y="90" width="535" height="455" rx="18" fill="#fbfdff" stroke="#c9d9e8" stroke-width="2"/>
<rect x="620" y="90" width="535" height="455" rx="18" fill="#fbfdff" stroke="#c9d9e8" stroke-width="2"/>
<text x="215" y="135" class="subtitle">AND条件</text>
<text x="802" y="135" class="subtitle">OR条件</text>
<!-- AND -->
<rect x="105" y="175" width="410" height="92" rx="16" class="callout"/>
<text x="130" y="210" class="body">親ゲート：最初の条件で絞る</text>
<text x="130" y="242" class="small">例：散乱光でドロップレット候補を選ぶ</text>
<line x1="310" y1="267" x2="310" y2="315" stroke="#0b5fa5" stroke-width="6"/>
<polygon points="310,325 297,304 323,304" fill="#0b5fa5"/>
<rect x="125" y="326" width="370" height="92" rx="16" class="good"/>
<text x="150" y="361" class="body">子ゲート：親の中をさらに絞る</text>
<text x="150" y="393" class="small">例：その中から蛍光が強いものを選ぶ</text>
<rect x="115" y="447" width="390" height="62" rx="14" fill="#173d66"/>
<text x="145" y="486" style="font:700 23px 'Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif;fill:white">親を通過 かつ 子の条件を満たす</text>
<!-- OR -->
<rect x="680" y="180" width="175" height="85" rx="16" class="callout"/>
<text x="718" y="218" class="body">Group A</text>
<text x="702" y="247" class="small">条件Aに入る</text>
<rect x="680" y="330" width="175" height="85" rx="16" class="warn"/>
<text x="718" y="368" class="body">Group B</text>
<text x="702" y="397" class="small">条件Bに入る</text>
<path d="M855 222 C920 222,930 270,975 300" stroke="#0b5fa5" stroke-width="6" fill="none"/>
<path d="M855 372 C920 372,930 330,975 300" stroke="#d94343" stroke-width="6" fill="none"/>
<polygon points="985,300 965,288 965,312" fill="#263746"/>
<rect x="985" y="245" width="120" height="110" rx="18" fill="#173d66"/>
<text x="1012" y="287" style="font:700 25px 'Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif;fill:white">選別</text>
<text x="1000" y="322" style="font:700 21px 'Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif;fill:white">対象</text>
<rect x="680" y="447" width="425" height="62" rx="14" fill="#173d66"/>
<text x="716" y="486" style="font:700 23px 'Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif;fill:white">Group A または Group B に入る</text>
<text x="215" y="575" class="small">ゲート＝選ぶ条件　　ポピュレーション＝条件に入ったイベントの集まり</text>
</svg>