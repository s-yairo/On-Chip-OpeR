<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="ドットプロットの読み方">
<style>
  .title{font:700 32px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#173d66}
  .subtitle{font:700 24px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#0b5fa5}
  .body{font:500 22px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#23364a}
  .small{font:500 19px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#52677b}
  .axis{stroke:#263746;stroke-width:4;fill:none;stroke-linecap:round}
  .grid{stroke:#e7edf3;stroke-width:2}
  .panel{fill:#ffffff;stroke:#c9d9e8;stroke-width:2}
  .callout{fill:#eef7ff;stroke:#9fc6e8;stroke-width:2}
</style>
<rect x="1" y="1" width="1198" height="558" rx="20" class="panel"/>
<text x="50" y="58" class="title">ドットプロットの読み方</text>
<rect x="55" y="88" width="1090" height="410" rx="16" fill="#fbfdff" stroke="#d8e1eb" stroke-width="2"/>
<line x1="135" y1="430" x2="1070" y2="430" class="axis"/>
<polygon points="1070,430 1048,418 1048,442" fill="#263746"/>
<line x1="135" y1="430" x2="135" y2="145" class="axis"/>
<polygon points="135,145 123,167 147,167" fill="#263746"/>
<line x1="135" y1="360" x2="1070" y2="360" class="grid"/>
<line x1="135" y1="290" x2="1070" y2="290" class="grid"/>
<line x1="135" y1="220" x2="1070" y2="220" class="grid"/>
<line x1="360" y1="145" x2="360" y2="430" class="grid"/>
<line x1="585" y1="145" x2="585" y2="430" class="grid"/>
<line x1="810" y1="145" x2="810" y2="430" class="grid"/>
<g fill="#1677c8" opacity=".88">
  <circle cx="250" cy="355" r="8"/><circle cx="275" cy="340" r="8"/><circle cx="295" cy="365" r="8"/><circle cx="320" cy="335" r="8"/>
  <circle cx="485" cy="320" r="8"/><circle cx="520" cy="300" r="8"/><circle cx="555" cy="280" r="8"/><circle cx="590" cy="260" r="8"/>
  <circle cx="620" cy="250" r="8"/><circle cx="660" cy="230" r="8"/><circle cx="700" cy="205" r="8"/><circle cx="740" cy="190" r="8"/>
  <circle cx="780" cy="175" r="8"/><circle cx="825" cy="165" r="8"/>
</g>
<rect x="700" y="105" width="365" height="78" rx="14" class="callout"/>
<text x="725" y="138" class="subtitle">1点＝1イベント</text>
<text x="725" y="168" class="body">右・上ほど各軸の信号が強い</text>
<path d="M790 183 L760 210" stroke="#0b5fa5" stroke-width="4" fill="none"/>
<polygon points="760,210 766,191 778,204" fill="#0b5fa5"/>
<text x="250" y="470" class="small">弱い</text>
<text x="970" y="470" class="small">強い</text>
<text x="490" y="482" class="subtitle">横軸：1つ目の測定値</text>
<text x="56" y="330" class="subtitle" transform="rotate(-90 56 330)">縦軸：2つ目の測定値</text>
<text x="315" y="535" class="body">点の位置から、2つの信号を同時に比較します</text>
</svg>
