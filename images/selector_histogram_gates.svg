<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="サンドイッチゲートとスプリッターゲート">
<style>
  .title{font:700 32px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#173d66}
  .subtitle{font:700 24px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#0b5fa5}
  .body{font:500 22px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#23364a}
  .small{font:500 19px "Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#52677b}
  .axis{stroke:#263746;stroke-width:4;fill:none;stroke-linecap:round}
  .curve{stroke:#1677c8;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .curve2{stroke:#d94343;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .panel{fill:#ffffff;stroke:#c9d9e8;stroke-width:2}
  .grid{stroke:#e7edf3;stroke-width:2}
  .callout{fill:#eef7ff;stroke:#9fc6e8;stroke-width:2}
  .good{fill:#effaf3;stroke:#77c795;stroke-width:2}
  .warn{fill:#fff9df;stroke:#e0a800;stroke-width:2}
</style>
<rect x="1" y="1" width="1198" height="588" rx="20" class="panel"/>
<text x="50" y="58" class="title">ヒストグラムで使う2種類のゲート</text>
<rect x="45" y="85" width="535" height="455" rx="18" fill="#fbfdff" stroke="#c9d9e8" stroke-width="2"/>
<rect x="620" y="85" width="535" height="455" rx="18" fill="#fbfdff" stroke="#c9d9e8" stroke-width="2"/>
<text x="105" y="130" class="subtitle">2本の線で範囲を選ぶ</text>
<text x="720" y="130" class="subtitle">1本の線で2群に分ける</text>
<!-- left axes -->
<line x1="100" y1="390" x2="530" y2="390" class="axis"/><polygon points="530,390 510,379 510,401" fill="#263746"/>
<line x1="100" y1="390" x2="100" y2="185" class="axis"/><polygon points="100,185 89,205 111,205" fill="#263746"/>
<path d="M112 390 C165 385,190 330,220 250 C250 170,310 185,340 260 C370 335,405 382,515 390" fill="none" class="curve"/>
<rect x="225" y="185" width="155" height="205" fill="#dcefff" opacity="0.72"/>
<line x1="225" y1="175" x2="225" y2="398" stroke="#0b5fa5" stroke-width="6"/>
<line x1="380" y1="175" x2="380" y2="398" stroke="#0b5fa5" stroke-width="6"/>
<text x="236" y="225" class="body">選択範囲</text>
<text x="134" y="430" class="small">範囲外</text><text x="263" y="430" class="small">範囲内</text><text x="422" y="430" class="small">範囲外</text>
<rect x="95" y="458" width="435" height="58" rx="13" class="callout"/>
<text x="120" y="495" class="body">サンドイッチゲート：間だけを選択</text>
<!-- right axes -->
<line x1="675" y1="390" x2="1105" y2="390" class="axis"/><polygon points="1105,390 1085,379 1085,401" fill="#263746"/>
<line x1="675" y1="390" x2="675" y2="185" class="axis"/><polygon points="675,185 664,205 686,205" fill="#263746"/>
<rect x="675" y="185" width="220" height="205" fill="#e7edf3" opacity="0.9"/>
<rect x="895" y="185" width="210" height="205" fill="#ffe5e5" opacity="0.9"/>
<path d="M687 390 C740 385,765 330,795 250 C825 170,885 185,915 260 C945 335,980 382,1090 390" fill="none" class="curve2"/>
<line x1="895" y1="175" x2="895" y2="398" stroke="#d94343" stroke-width="6"/>
<text x="742" y="230" class="body">低い群</text>
<text x="955" y="230" class="body">高い群</text>
<text x="714" y="430" class="small">境界より低い</text><text x="925" y="430" class="small">境界より高い</text>
<rect x="670" y="458" width="435" height="58" rx="13" class="warn"/>
<text x="694" y="495" class="body">スプリッターゲート：左右に分ける</text>
<text x="300" y="570" class="small">どちらも境界線をドラッグして位置を調整します。</text>
</svg>